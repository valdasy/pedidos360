# =========================================================
# Pedidos360 - Microservicios (EC2 "apps")
#
#   cp .env.example .env            -> completar IPs y claves
#   docker compose up -d --build    -> compila las imágenes y levanta todo
#   docker compose logs -f orders   -> ver logs de un servicio
#   docker compose ps
#
# RabbitMQ (clúster de 2 nodos + Mailpit) corre en la EC2 "mq" (infra/mq-cluster), Kafka en la
# EC2 "kafka" (infra/kafka) y Oracle en la EC2 "db" (infra/db; el Learner Lab bloquea RDS Oracle).
# Este archivo solo contiene las aplicaciones.
# =========================================================
name: pedidos360-apps

x-common-env: &common-env
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  # Clúster: lista de nodos (AMQP) y una URL de Management por nodo. Si no se definen,
  # se usa solo RABBITMQ_HOST (un nodo).
  RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-${RABBITMQ_HOST}:5672}
  RABBITMQ_MANAGEMENT_URLS: ${RABBITMQ_MANAGEMENT_URLS:-http://${RABBITMQ_HOST}:15672/api}
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}
  SECURITY_ENABLED: ${SECURITY_ENABLED:-false}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-sin-configurar}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:-sin-configurar}
  TZ: America/Santiago

x-db-env: &db-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-1521}
  DB_SERVICE: ${DB_SERVICE:-FREEPDB1}

# Kafka (Evaluación 3): brokers de la EC2 kafka (IP privada, puertos 9092 y 9093)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092,localhost:9093}

# 7 JVM en la misma EC2: se limita la memoria de cada contenedor (la JVM usa el 75 %).
# Sin límite, cada JVM calcularía su heap sobre los 8 GB de la máquina.
x-limits: &limits
  mem_limit: ${APP_MEM_LIMIT:-768m}
  restart: unless-stopped

services:
  catalog:
    build: ../../ms-pedidos360-catalog
    image: pedidos360/catalog
    container_name: pedidos360-catalog
    ports:
      - "8082:8082"
    environment:
      <<: [*common-env, *db-env, *kafka-env]
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    <<: *limits

  orders:
    build: ../../ms-pedidos360-orders
    image: pedidos360/orders
    container_name: pedidos360-orders
    ports:
      - "8081:8081"
    environment:
      <<: [*common-env, *db-env, *kafka-env]
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      # Dentro de la red de Docker los servicios se encuentran por nombre
      CATALOG_URL: http://catalog:8082
    depends_on:
      - catalog
    <<: *limits

  notify:
    build: ../../ms-pedidos360-notify
    image: pedidos360/notify
    container_name: pedidos360-notify
    # Sin puertos: solo consume de RabbitMQ (no público, como pide el caso)
    environment:
      <<: *common-env
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-1025}
    <<: *limits

  mq-admin:
    build: ../../ms-pedidos360-mq-admin
    image: pedidos360/mq-admin
    container_name: pedidos360-mq-admin
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
    <<: *limits

  # ---------------- Kafka (Evaluación 3) ----------------
  audit:
    build: ../../ms-pedidos360-audit
    image: pedidos360/audit
    container_name: pedidos360-audit
    ports:
      - "8086:8086"
    environment:
      <<: [*common-env, *db-env, *kafka-env]
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    <<: *limits

  report:
    build: ../../ms-pedidos360-report
    image: pedidos360/report
    container_name: pedidos360-report
    ports:
      - "8087:8087"
    environment:
      <<: [*common-env, *db-env, *kafka-env]
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
    <<: *limits

  kafka-admin:
    build: ../../ms-pedidos360-kafka-admin
    image: pedidos360/kafka-admin
    container_name: pedidos360-kafka-admin
    ports:
      - "8088:8088"
    environment:
      <<: [*common-env, *kafka-env]
    <<: *limits
