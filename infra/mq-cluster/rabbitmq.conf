# Formación automática del clúster: al arrancar, cada nodo busca a los de esta lista
# y se une a ellos. Los nombres deben resolverse (en Docker, por hostname del servicio).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Al crear una cola, ubicarla en el nodo con menos colas: así las 6 colas quedan
# repartidas entre los 2 nodos (reparte la carga y, si cae un nodo, solo se afectan
# las colas de ese nodo). Sin esto, todas quedarían en el nodo que recibió la definición.
queue_leader_locator = balanced
