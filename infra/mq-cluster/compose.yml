# =========================================================
# Pedidos360 - Broker principal: clúster RabbitMQ de 2 nodos + Mailpit
#
# Reemplaza a infra/mq (1 nodo). No levantes ambos a la vez: usan los mismos puertos.
#   nodo 1: AMQP 5672, UI http://localhost:15672
#   nodo 2: AMQP 5673, UI http://localhost:15673
#   Mailpit: SMTP 1025, bandeja http://localhost:8025
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose run --rm topology-init     -> carga exchanges, colas y políticas
#   docker exec pedidos360-rabbit1 rabbitmqctl cluster_status
# =========================================================
name: pedidos360-mq-cluster

# Configuración común a los dos nodos
x-rabbit: &rabbit
  image: rabbitmq:4.1.4-management
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    # Los nodos de un clúster se autentican entre sí con la misma "erlang cookie"
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${ERLANG_COOKIE}
    RABBITMQ_CTL_ERL_ARGS: -setcookie ${ERLANG_COOKIE}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 5s
    retries: 30
  restart: unless-stopped

services:
  rabbit1:
    <<: *rabbit
    hostname: rabbit1                 # nombre del nodo: rabbit@rabbit1
    container_name: pedidos360-rabbit1
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit1_data:/var/lib/rabbitmq

  rabbit2:
    <<: *rabbit
    hostname: rabbit2                 # nombre del nodo: rabbit@rabbit2
    container_name: pedidos360-rabbit2
    ports: ["5673:5672", "15673:15672"]
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit2_data:/var/lib/rabbitmq
    depends_on:
      rabbit1:
        condition: service_healthy

  # Servidor SMTP falso (igual que en infra/mq): bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: pedidos360-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  # Carga exchanges, colas, bindings y políticas (infra/mq/definitions.json).
  # Basta con enviarlo a un nodo: las definiciones se replican a todo el clúster.
  # Con queue_leader_locator = balanced (rabbitmq.conf) las colas se reparten entre nodos.
  topology-init:
    image: curlimages/curl:8.16.0
    profiles: ["init"]
    depends_on:
      rabbit2:
        condition: service_healthy
    volumes:
      - ../mq/definitions.json:/definitions.json:ro
    command: >
      -sS -f -u ${RABBITMQ_USER}:${RABBITMQ_PASS}
      -H "content-type: application/json"
      -X POST --data-binary @/definitions.json
      http://rabbit1:15672/api/definitions

volumes:
  rabbit1_data:
  rabbit2_data:
  mailpit_data:
