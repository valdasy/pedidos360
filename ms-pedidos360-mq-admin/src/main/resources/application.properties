spring.application.name=ms-pedidos360-mq-admin
server.port=8085

# Lee usuario/clave del broker desde infra/mq/.env (formato CLAVE=valor).
# En Docker/EC2 se usan variables de entorno con el mismo nombre.
spring.config.import=optional:file:../infra/mq/.env[.properties],optional:file:../infra/security/.env[.properties]

# AMQP (5672): se usa para mover mensajes de la DLQ a su cola original
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# API HTTP de Management (15672): estado de colas, ver mensajes, purgar
pedidos360.mq.management-url=http://${RABBITMQ_HOST:localhost}:15672/api
pedidos360.mq.username=${RABBITMQ_USER}
pedidos360.mq.password=${RABBITMQ_PASS}

# Reglas de alerta
pedidos360.mq.alerts.dlq-critical=10
pedidos360.mq.alerts.backlog-warning=100
pedidos360.mq.alerts.check-interval-ms=30000
# Un mensaje se puede reprocesar desde la DLQ como máximo esta cantidad de veces
pedidos360.mq.max-reprocess=3

# ---------- Seguridad: JWT de Microsoft Entra ID (Etapa 6) ----------
# Desactivada por defecto para desarrollar sin Entra. Ver docs/etapa5-entra-id.md
pedidos360.security.enabled=${SECURITY_ENABLED:false}
pedidos360.security.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID:sin-configurar}/v2.0
pedidos360.security.audiences=${ENTRA_API_CLIENT_ID:sin-configurar},api://${ENTRA_API_CLIENT_ID:sin-configurar}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
