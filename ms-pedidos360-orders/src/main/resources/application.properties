spring.application.name=ms-pedidos360-orders
server.port=8081

# Claves locales desde infra/mq/.env, infra/db/.env e infra/security/.env (formato CLAVE=valor).
# En Docker/EC2 se usan variables de entorno con el mismo nombre.
spring.config.import=optional:file:../infra/mq/.env[.properties],optional:file:../infra/db/.env[.properties],optional:file:../infra/security/.env[.properties]

# ---------- RabbitMQ ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
# Publisher confirms: el broker confirma (ack) que recibió y guardó el mensaje.
spring.rabbitmq.publisher-confirm-type=correlated
# Publisher returns + mandatory: si ninguna cola coincide con la routing key,
# el broker DEVUELVE el mensaje en vez de descartarlo en silencio.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ---------- Oracle (local: contenedor, AWS: Amazon RDS) ----------
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${ORDERS_DB_USER:pedidos_orders}
spring.datasource.password=${ORDERS_DB_PASSWORD}
# Las tablas las crea Flyway (src/main/resources/db/migration), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Columnas TIMESTAMP en UTC (ver nota en ms-catalog: evita ORA-18716).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- ms-catalog (llamada síncrona para reservar stock) ----------
pedidos360.catalog.url=${CATALOG_URL:http://localhost:8082}

# ---------- Seguridad: JWT de Microsoft Entra ID (Etapa 6) ----------
# Desactivada por defecto para desarrollar sin Entra. Ver docs/etapa5-entra-id.md
pedidos360.security.enabled=${SECURITY_ENABLED:false}
pedidos360.security.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID:sin-configurar}/v2.0
# Client ID de la API (tokens v2) y su forma api://... por si acaso
pedidos360.security.audiences=${ENTRA_API_CLIENT_ID:sin-configurar},api://${ENTRA_API_CLIENT_ID:sin-configurar}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
