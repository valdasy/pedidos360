spring.application.name=ms-pedidos360-orders
server.port=8081

# Lee usuario/clave del broker desde infra/mq/.env (formato CLAVE=valor).
# En Docker/EC2 se usan variables de entorno con el mismo nombre.
spring.config.import=optional:file:../infra/mq/.env[.properties]

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# Publisher confirms: el broker confirma (ack) que recibió y guardó el mensaje.
spring.rabbitmq.publisher-confirm-type=correlated
# Publisher returns + mandatory: si ninguna cola coincide con la routing key,
# el broker DEVUELVE el mensaje en vez de descartarlo en silencio.
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
