spring.application.name=ms-pedidos360-catalog
server.port=8082

# Claves locales desde infra/db/.env. En Docker/EC2: variables de entorno.
spring.config.import=optional:file:../infra/db/.env[.properties],optional:file:../infra/security/.env[.properties],optional:file:../infra/kafka/.env[.properties]

# ---------- Kafka: productor de "inventario.eventos" (Evaluación 3) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=5
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.client-id=ms-pedidos360-catalog

# Oracle: local = contenedor gvenzl/oracle-free, AWS = endpoint de Amazon RDS
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${CATALOG_DB_USER:pedidos_catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}

# Las tablas las crea Flyway (src/main/resources/db/migration), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Las columnas son TIMESTAMP (sin zona) y se guardan en UTC. Sin esto, Hibernate 7
# trata Instant como TIMESTAMP WITH TIME ZONE y Oracle falla con ORA-18716.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Seguridad: JWT de Microsoft Entra ID (Etapa 6) ----------
# Desactivada por defecto para desarrollar sin Entra. Ver docs/etapa5-entra-id.md
pedidos360.security.enabled=${SECURITY_ENABLED:false}
pedidos360.security.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID:sin-configurar}/v2.0
pedidos360.security.audiences=${ENTRA_API_CLIENT_ID:sin-configurar},api://${ENTRA_API_CLIENT_ID:sin-configurar}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
