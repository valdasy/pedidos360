spring.application.name=ms-pedidos360-catalog
server.port=8082

# Claves locales desde infra/db/.env. En Docker/EC2: variables de entorno.
spring.config.import=optional:file:../infra/db/.env[.properties]

# Oracle: local = contenedor gvenzl/oracle-free, AWS = endpoint de Amazon RDS
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${CATALOG_DB_USER:pedidos_catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}

# Las tablas las crea Flyway (src/main/resources/db/migration), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Las columnas son TIMESTAMP (sin zona) y se guardan en UTC. Sin esto, Hibernate 7
# trata Instant como TIMESTAMP WITH TIME ZONE y Oracle falla con ORA-18716.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
