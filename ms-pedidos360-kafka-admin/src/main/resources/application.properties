spring.application.name=ms-pedidos360-kafka-admin
server.port=8088

spring.config.import=optional:file:../infra/security/.env[.properties],optional:file:../infra/kafka/.env[.properties]

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
# Productor de texto plano: solo para publicar mensajes de prueba (demostrar errores y DLT)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.client-id=ms-pedidos360-kafka-admin
# Sin @KafkaListener: este servicio administra, no consume
spring.kafka.admin.fail-fast=false

# ---------- Seguridad: JWT de Microsoft Entra ID (solo rol Admin) ----------
pedidos360.security.enabled=${SECURITY_ENABLED:false}
pedidos360.security.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID:sin-configurar}/v2.0
pedidos360.security.audiences=${ENTRA_API_CLIENT_ID:sin-configurar},api://${ENTRA_API_CLIENT_ID:sin-configurar}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
