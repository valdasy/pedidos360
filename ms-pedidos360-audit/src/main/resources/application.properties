spring.application.name=ms-pedidos360-audit
server.port=8086

# Claves locales desde los .env de infra. En Docker/EC2: variables de entorno.
spring.config.import=optional:file:../infra/db/.env[.properties],optional:file:../infra/security/.env[.properties],optional:file:../infra/kafka/.env[.properties]

# ---------- Kafka: consumidor (Evaluación 3) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.consumer.group-id=pedidos360-audit
spring.kafka.consumer.client-id=ms-pedidos360-audit
# Grupo nuevo: empieza desde el primer evento guardado en el tópico (no solo los nuevos)
spring.kafka.consumer.auto-offset-reset=earliest
# El offset lo confirma Spring DESPUÉS de procesar cada evento (ack-mode=record), no un timer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer envuelve al deserializador JSON: si un mensaje viene mal formado,
# en vez de reventar el consumidor en un bucle, entrega el error al DefaultErrorHandler (-> DLT)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# No usar cabeceras de tipo Java: cada @KafkaListener indica su DTO (spring.json.value.default.type)
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.pedidos360.audit.events
# Hilos consumidores por listener (máximo útil = particiones). 1 para ver el reparto con 2 instancias.
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:1}
# Si un tópico aún no existe, el consumidor espera en vez de no arrancar
spring.kafka.listener.missing-topics-fatal=false

# ---------- Oracle: esquema propio (database per service) ----------
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=${AUDIT_DB_USER:pedidos_audit}
spring.datasource.password=${AUDIT_DB_PASSWORD}
# Timeouts cortos: si Oracle no responde, el error (transitorio) se detecta rápido y el
# DefaultErrorHandler reintenta; sin esto un consumidor quedaría colgado minutos.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=8000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Seguridad: JWT de Microsoft Entra ID ----------
pedidos360.security.enabled=${SECURITY_ENABLED:false}
pedidos360.security.issuer=https://login.microsoftonline.com/${ENTRA_TENANT_ID:sin-configurar}/v2.0
pedidos360.security.audiences=${ENTRA_API_CLIENT_ID:sin-configurar},api://${ENTRA_API_CLIENT_ID:sin-configurar}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
