spring.application.name=ms-pedidos360-notify

# Lee usuario/clave del broker desde infra/mq/.env (formato CLAVE=valor).
# En Docker/EC2 se usan variables de entorno con el mismo nombre.
spring.config.import=optional:file:../infra/mq/.env[.properties],optional:file:../infra/mq-cluster/.env[.properties]

# Lista de nodos del clúster (host:puerto,host:puerto). Si un nodo cae, Spring se
# reconecta al siguiente. Con un solo broker: RABBITMQ_HOST:5672.
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# ACK manual: el código decide cuándo confirmar (ack), reintentar (nack) o
# enviar a la DLQ (reject sin reencolar). Ver CommandListener.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Máximo de mensajes entregados y sin confirmar por consumidor (Unacked).
spring.rabbitmq.listener.simple.prefetch=10
# Clúster: si cae el nodo donde vive una cola, la cola queda "no disponible". Por defecto
# Spring lo trata como error FATAL y detiene ese listener para siempre (comprobado: al volver
# el nodo nadie consumía). Con false sigue reintentando cada 5 s hasta que la cola vuelva.
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# SMTP: Mailpit en desarrollo (bandeja en http://localhost:8025)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
# Sin timeouts, JavaMail espera indefinidamente si el SMTP no responde y el
# consumidor queda bloqueado (los mensajes se acumulan como Unacked).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
pedidos360.mail.from=no-reply@pedidos360.cl
