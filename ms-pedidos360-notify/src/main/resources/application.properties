spring.application.name=ms-pedidos360-notify

# Lee usuario/clave del broker desde infra/mq/.env (formato CLAVE=valor).
# En Docker/EC2 se usan variables de entorno con el mismo nombre.
spring.config.import=optional:file:../infra/mq/.env[.properties]

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# ACK manual: el código decide cuándo confirmar (ack), reintentar (nack) o
# enviar a la DLQ (reject sin reencolar). Ver CommandListener.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Máximo de mensajes entregados y sin confirmar por consumidor (Unacked).
spring.rabbitmq.listener.simple.prefetch=10

# SMTP: Mailpit en desarrollo (bandeja en http://localhost:8025)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
# Sin timeouts, JavaMail espera indefinidamente si el SMTP no responde y el
# consumidor queda bloqueado (los mensajes se acumulan como Unacked).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
pedidos360.mail.from=no-reply@pedidos360.cl
